        type: string
        format: date-time
        description: ISO 8601 UTC datetime to defer execution (omit for immediate)

  CreateWorkflowRunResponse:
    type: object
    properties:
      workflow_run_id:
        type: string
        description: ID of the created workflow run
      external_id:
        type: string
        description: External ID of the prospect associated with this run

