        type: string
        description: Evaluation key (e.g. INTERESTED, CALLBACK_REQUESTED)
      extracted_value:
        type: string
        description: Extracted text value (for extraction-type outcomes)
      result_boolean:
        type: boolean
        description: True/false result (for boolean-type outcomes)
      reasoning:
        type: string
        description: AI reasoning for this evaluation
      created_at:
        type: string
        format: date-time

  CallToolLogResponse:
    type: object
