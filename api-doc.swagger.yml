        type: array
        items:
          $ref: '#/definitions/CallListItemResponse'
      meta:
        $ref: '#/definitions/PaginationMeta'

  CallDetailResponse:
    type: object
    properties:
      id:
        type: string
      status:
        type: string
        description: "SCHEDULED | RINGING | IN_PROGRESS | completed | no-answer | failed | busy | cancelled"
      direction:
        type: string
        description: "INBOUND | OUTBOUND"
      from_number:
        type: string
      to_number:
        type: string
      agent_name:
        type: string
      initial_agent_id:
        type: string
      organization_id:
        type: string
      prospect_id:
        type: string
      prospect_first_name:
        type: string
      prospect_last_name:
        type: string
      prospect_phone:
        type: string
      prospect_email:
        type: string
      prospect_external_id:
        type: string
      duration_seconds:
        type: integer
      stt_duration_seconds:
        type: integer
      tts_characters:
        type: integer
      tokens_input:
        type: integer
      tokens_output:
        type: integer
      cost_usd:
        type: string
      transcript_text:
        type: string
        description: Full call transcript (null if not yet available)
      summary:
        type: string
        description: AI-generated call summary
      recording_url:
        type: string
        description: Signed URL to the call recording (MP3)
      recording_slug:
        type: string
      evaluations:
        type: array
