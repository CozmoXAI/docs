  # ---------------------------------------------------------------------------

  CallListItemResponse:
    type: object
    properties:
      id:
        type: string
      status:
        type: string
        description: "SCHEDULED | RINGING | IN_PROGRESS | completed | no-answer | failed | busy | cancelled"
      direction:
        type: string
        description: "INBOUND | OUTBOUND"
      from_number:
        type: string
      to_number:
        type: string
      agent_name:
        type: string
      initial_agent_id:
        type: string
