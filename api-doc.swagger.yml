    properties:
      phone:
        type: string
        description: Phone number in E.164 format (e.g. +19175551234)
        example: "+19175551234"
      first_name:
        type: string
      last_name:
        type: string
      email:
        type: string
      external_id:
        type: string
        description: Your CRM or system ID for this prospect
      country:
        type: string
        description: ISO 3166-1 alpha-2 country code
      timezone:
        type: string
        description: IANA timezone (e.g. America/New_York)
      custom_data:
        type: object
        additionalProperties: true
        description: Arbitrary key-value pairs passed into the workflow context

  CreateWorkflowRunRequest:
    type: object
    required:
      - workflow_id
      - prospect
    properties:
      workflow_id:
        type: string
