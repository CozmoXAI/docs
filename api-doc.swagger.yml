  # ---------------------------------------------------------------------------
  # Admin / Health
  # ---------------------------------------------------------------------------

  LivenessResponse:
    type: object
    description: Response from the liveness probe
    properties:
      status:
        type: string
        description: Always "ok" when alive
        example: "ok"

  ReadinessResponse:
    type: object
    description: Response from the readiness probe
    properties:
      status:
        type: string
        description: '"ok" when ready, "not ready" when unavailable'
        example: "ok"
      details:
        type: object
        additionalProperties:
          type: string
        description: Per-dependency readiness details (e.g. database, cache)
