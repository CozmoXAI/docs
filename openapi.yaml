components:
  requestBodies:
    tags.BulkTagProspectsRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/tags.BulkTagProspectsRequest'
      description: Prospect IDs
      required: true
    chat.SendMessageRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/chat.SendMessageRequest'
      description: Chat message
      required: true
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    admin.LivenessResponse:
      properties:
        status:
          example: ok
          type: string
      type: object
    admin.ReadinessResponse:
      properties:
        database:
          example: ok
          type: string
        status:
          example: ok
          type: string
      type: object
    agent-sessions.StartSessionRequest:
      required:
        - agentId
        - instruction
      properties:
        agentId:
          description: ID of the agent to run for this session.
          type: string
        instruction:
          description: Initial instruction sent to the agent as the first user message.
          type: string
        title:
          description: Human-readable label for the session.
          type: string
        source:
          description: Caller identifier (e.g. command-center, api).
          type: string
        prospectId:
          description: ID of an existing prospect to associate with the session.
          type: string
      type: object
    agent-sessions.StartSessionResponse:
      properties:
        sessionId:
          description: The UUID of the newly started session.
          type: string
      type: object
    agent-sessions.CreateSessionRequest:
      required:
        - root_agent_id
      description: Exactly one of prospect_id or new_prospect must be provided.
      properties:
        id:
          description: Optional session ID (UUID). Auto-generated if omitted.
          type: string
        root_agent_id:
          description: ID of the root agent handling this session.
          type: string
        prospect_id:
          description: ID of an existing prospect. Required if new_prospect is not provided.
          type: string
        new_prospect:
          description: Inline prospect to create. Required if prospect_id is not provided.
          $ref: '#/components/schemas/agent-sessions.NewProspectRequest'
        workflow_run_id:
          description: Workflow run associated with this session.
          type: string
        call_id:
          description: Call associated with this session.
          type: string
        title:
          type: string
        channel:
          description: Channel the session was initiated from (e.g. voice, chat).
          type: string
        entrypoint:
          type: string
        status:
          type: string
        agent_binding:
          additionalProperties: true
          description: Arbitrary JSON payload binding agent-specific configuration.
          type: object
        bootstrap:
          additionalProperties: true
          description: Arbitrary JSON payload used to bootstrap the session.
          type: object
        external_refs:
          additionalProperties: true
          description: External reference IDs for this session.
          type: object
        metadata:
          additionalProperties: true
          description: Arbitrary metadata for this session.
          type: object
      type: object
    agent-sessions.NewProspectRequest:
      description: Inline prospect creation. Used when prospect_id is not supplied.
      properties:
        phone:
          description: Phone number in E.164 format.
          type: string
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
        external_id:
          type: string
      required:
        - phone
      type: object
    agent-sessions.SessionResponse:
      properties:
        id:
          type: string
        organization_id:
          type: string
        root_agent_id:
          type: string
        prospect_id:
          type: string
        workflow_run_id:
          type: string
        call_id:
          type: string
        case_id:
          description: Auto-generated 6-character alphanumeric case identifier.
          type: string
        title:
          type: string
        channel:
          type: string
        entrypoint:
          type: string
        status:
          type: string
        agent_binding:
          additionalProperties: true
          type: object
        bootstrap:
          additionalProperties: true
          type: object
        external_refs:
          additionalProperties: true
          type: object
        metadata:
          additionalProperties: true
          type: object
        last_event_sequence:
          format: int64
          type: integer
        last_journal_sequence:
          format: int64
          type: integer
        last_handle_version:
          format: int64
          type: integer
        last_event_at:
          type: string
        last_activity_at:
          type: string
        started_at:
          type: string
        ended_at:
          type: string
        created_by:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
      type: object
    agents.AddAgentSipTrunkRequest:
      properties:
        sip_trunk_id:
          type: string
      required:
        - sip_trunk_id
      type: object
    agents.AddAgentToolRequest:
      properties:
        config_override:
          additionalProperties: true
          type: object
        is_enabled:
          type: boolean
        tool_id:
          type: string
      required:
        - tool_id
      type: object
    agents.AgentListItemResponse:
      properties:
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        type:
          type: string
        updated_at:
          type: string
      type: object
    agents.AgentResponse:
      properties:
        allowed_sip_trunks:
          items:
            type: string
          type: array
        background_sound:
          items:
            type: integer
          type: array
        created_at:
          type: string
        default_functions:
          items:
            type: string
          type: array
        extra_config:
          items:
            type: integer
          type: array
        goodbye_config:
          items:
            type: integer
          type: array
        greeting_config:
          items:
            type: integer
          type: array
        id:
          type: string
        llm_config:
          items:
            type: integer
          type: array
        name:
          type: string
        organization_id:
          type: string
        plugins:
          items:
            type: integer
          type: array
        precall_webhook:
          items:
            type: integer
          type: array
        prompt_template:
          type: string
        public_quota:
          type: integer
        room_duration_config:
          items:
            type: integer
          type: array
        tools:
          items:
            $ref: '#/components/schemas/agents.AgentToolResponse'
          type: array
        transcriber_config:
          items:
            type: integer
          type: array
        type:
          type: string
        updated_at:
          type: string
        vad_config:
          items:
            type: integer
          type: array
        voice_config:
          items:
            type: integer
          type: array
      type: object
    agents.AgentScenariosResponse:
      properties:
        agent_id:
          type: string
        count:
          type: integer
        scenarios:
          items:
            $ref: '#/components/schemas/agents.ScenarioSummaryResponse'
          type: array
      type: object
    agents.AgentSipTrunkResponse:
      properties:
        id:
          type: string
        is_active:
          type: boolean
        name:
          type: string
        provider:
          type: string
        type:
          type: string
      type: object
    agents.AgentToolResponse:
      properties:
        config_override:
          additionalProperties: true
          type: object
        description:
          type: string
        is_enabled:
          type: boolean
        method:
          type: string
        name:
          type: string
        parameters:
          items:
            $ref: '#/components/schemas/agents.ToolParameter'
          type: array
        tool_id:
          type: string
        url:
          type: string
      type: object
    agents.AttachScenariosResponse:
      properties:
        attached:
          items:
            type: string
          type: array
        skipped:
          items:
            type: string
          type: array
      type: object
    agents.AttachScenariosToAgentRequest:
      properties:
        scenario_ids:
          items:
            type: string
          minItems: 1
          type: array
      required:
        - scenario_ids
      type: object
    agents.BackgroundSoundConfig:
      properties:
        enabled:
          type: boolean
        file:
          type: string
        initial_volume:
          maximum: 1
          minimum: 0
          type: number
        thinking_sound:
          items:
            $ref: '#/components/schemas/agents.ThinkingSound'
          type: array
        volume:
          maximum: 1
          minimum: 0
          type: number
      required:
        - file
      type: object
    agents.CreateAgentRequest:
      properties:
        copy_from_agent_id:
          type: string
        name:
          type: string
        prompt_template:
          type: string
        type:
          enum:
            - voice
            - chat
            - video
          type: string
      required:
        - name
        - type
      type: object
    agents.ExtraConfig:
      properties:
        allow_interruptions:
          type: boolean
        interruption_sensitivity:
          maximum: 1
          minimum: 0
          type: number
        min_words:
          minimum: 0
          type: integer
        turn_detector_enabled:
          type: boolean
        turn_detector_is_multilingual:
          type: boolean
        turn_detector_model_type:
          type: string
        use_gender_plugin:
          enum:
            - none
            - pitch
            - enhanced
            - enhanced-multi
          type: string
      type: object
    agents.GoodbyeConfig:
      properties:
        enabled:
          type: boolean
        message:
          maxLength: 500
          type: string
      type: object
    agents.GreetingConfig:
      properties:
        agent_speaks_first:
          type: boolean
        greeting:
          type: string
        pause_before_first_message:
          minimum: 0
          type: integer
        voice_mail_message:
          type: string
        welcome_message_is_generated:
          type: boolean
      type: object
    agents.LLMConfig:
      properties:
        fallbacks:
          description: Ordered list of fallback providers tried in sequence when the primary LLM fails
          items:
            $ref: '#/components/schemas/agents.LLMConfig'
          type: array
        frequency_penalty:
          maximum: 2
          minimum: -2
          type: number
        max_tokens:
          minimum: 1
          type: integer
        model:
          type: string
        parallel_tool_calls:
          type: boolean
        presence_penalty:
          description: OpenAI Only
          maximum: 2
          minimum: -2
          type: number
        provider:
          description: Core (All Providers)
          enum:
            - openai
            - anthropic
            - google
            - groq
            - cerebras
          type: string
        system_prompt:
          type: string
        temperature:
          description: Sampling Parameters (All Providers)
          maximum: 2
          minimum: 0
          type: number
        top_k:
          description: Anthropic Only
          minimum: 1
          type: integer
        top_p:
          maximum: 1
          minimum: 0
          type: number
      required:
        - model
        - provider
      type: object
    agents.PaginatedResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/agents.AgentListItemResponse'
          type: array
        meta:
          $ref: '#/components/schemas/agents.PaginationMeta'
      type: object
    agents.PaginationMeta:
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    agents.PrecallWebhookConfig:
      properties:
        body_template:
          additionalProperties: true
          type: object
        headers:
          additionalProperties:
            type: string
          type: object
        method:
          enum:
            - GET
            - POST
            - PUT
            - PATCH
          type: string
        timeout_seconds:
          maximum: 60
          minimum: 1
          type: integer
        url:
          type: string
      required:
        - method
        - url
      type: object
    agents.ReplenishQuotaRequest:
      properties:
        quota:
          minimum: 0
          type: integer
      required:
        - quota
      type: object
    agents.RoomDurationConfig:
      properties:
        close_room_message:
          type: string
        duration_warning_message:
          type: string
        max_duration_min:
          minimum: 1
          type: integer
