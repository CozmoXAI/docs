openapi: 3.0.0
servers:
  - url: https://v2-nova-api.prod.czmx.in/api
info:
  contact: {}
  title: Cozmo - API
  version: devel
paths:
  /api/contact:
    post:
      description: Submit a public contact form. Requires Turnstile token validation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/contact.ContactFormRequest"
        description: Contact form submission
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/contact.ContactFormResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "403":
          description: Turnstile validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Submit contact form
      tags:
        - Contact
  /api/integrations/oauth/callback:
    get:
      description: Exchanges the authorization code for tokens and stores the credentials
      parameters:
        - description: Authorization code from provider
          in: query
          name: code
          required: true
          schema:
            type: string
        - description: State token for CSRF protection
          in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        "301":
          description: Redirect to frontend with error status
      summary: Handle OAuth callback
      tags:
        - OAuth
  /auth/callback:
    get:
      description: Callback from OAuth provider
      responses:
        "200":
          description: Login successful
          content:
            "*/*":
              schema:
                type: string
        "500":
          description: Failed to process the request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Callback
      tags:
        - Auth
  /auth/login:
    get:
      description: Authenticate user by redirecting to OAuth provider
      responses:
        "307":
          description: Redirect to OAuth provider
          content:
            "*/*":
              schema:
                type: string
        "500":
          description: Failed to process the request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Authenticate user
      tags:
        - Auth
  /auth/logout:
    get:
      description: Clears the session and redirects to the logout URL
      responses:
        "307":
          description: Redirecting to logout URL
          content:
            application/json:
              schema:
                type: string
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Clears the session and redirects to the logout URL
      tags:
        - Authentication
  /auth/signup:
    get:
      description: Redirect to OAuth provider signup page
      responses:
        "307":
          description: Redirect to OAuth provider signup
          content:
            "*/*":
              schema:
                type: string
        "500":
          description: Failed to process the request
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Register new user
      tags:
        - Auth
  /billing/webhook:
    post:
      description: Handle payment provider webhook (FlexPrice via Svix)
      parameters:
        - description: Svix message ID
          in: header
          name: svix-id
          required: true
          schema:
            type: string
        - description: Svix timestamp
          in: header
          name: svix-timestamp
          required: true
          schema:
            type: string
        - description: Svix signature
          in: header
          name: svix-signature
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Handle webhook
      tags:
        - Billing
  "/invitations/{invitation_id}/accept":
    post:
      description: Accept an invitation and join the organization
      parameters:
        - description: Invitation ID
          in: path
          name: invitation_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/invitations.AcceptInvitationResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "500":
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Accept invitation
      tags:
        - Invitations
  /me:
    get:
      description: Returns the authenticated user's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/users.UserResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Get current user
      tags:
        - Users
  /me/organizations:
    get:
      description: Returns all organizations the authenticated user is a member of
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/users.OrganizationResponse"
                type: array
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: List user's organizations
      tags:
        - Users
  "/org/{org_id}/agents":
    get:
      description: Get a paginated list of agents for the organization
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Page size
          in: query
          name: size
          schema:
            type: integer
            default: 20
        - description: Filter by agent type (voice or chat)
          in: query
          name: type
          schema:
            type: string
        - description: Search by agent name
          in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agents.PaginatedResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: List agents
      tags:
        - Agents
    post:
      description: Create a new AI agent in the organization
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agents.CreateAgentRequest"
        description: Agent details
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agents.AgentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "409":
          description: Duplicate agent name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Create agent
      tags:
        - Agents
  "/org/{org_id}/agents/{agent_id}":
    delete:
      description: Delete an agent by ID
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Delete agent
      tags:
        - Agents
    get:
      description: Get agent details by ID
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agents.AgentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Get agent
      tags:
        - Agents
    patch:
      description: Update agent details (partial update)
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agents.UpdateAgentRequest"
        description: Agent update details
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/agents.AgentResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Update agent
      tags:
        - Agents
  "/org/{org_id}/agents/{agent_id}/run-specific-tests":
    post:
      description: Trigger execution of specific unit tests
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/evals_unit-tests.RunSpecificTestsRequest"
        description: Test IDs to run
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evals_unit-tests.RunTestsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Run specific tests
      tags:
        - Agent Unit Tests
  "/org/{org_id}/agents/{agent_id}/run-tests":
    post:
      description: Trigger execution of all unit tests for an agent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/evals_unit-tests.RunTestsResponse"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Run all tests
      tags:
        - Agent Unit Tests
  "/org/{org_id}/agents/{agent_id}/tools":
    get:
      description: Get all tools configured for an agent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/agents.AgentToolResponse"
                type: array
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Get agent tools
      tags:
        - Agents
    post:
      description: Add or update a tool configuration for an agent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agents.AddAgentToolRequest"
        description: Tool configuration
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Add tool to agent
      tags:
        - Agents
  "/org/{org_id}/agents/{agent_id}/tools/{tool_id}":
    delete:
      description: Remove a tool from an agent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
        - description: Tool ID
          in: path
          name: tool_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Remove tool from agent
      tags:
        - Agents
    patch:
      description: Update tool configuration for an agent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
        - description: Tool ID
          in: path
          name: tool_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/agents.UpdateAgentToolConfigRequest"
        description: Tool configuration update
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/helper.ResponseError"
      summary: Update tool configuration
      tags:
        - Agents
  "/org/{org_id}/agents/{agent_id}/unit-test-runs/latest":
    get:
      description: Get the latest test run results for an agent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
