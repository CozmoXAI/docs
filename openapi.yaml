openapi: 3.0.0
info:
  contact: {}
  title: Cozmo - API
  version: devel
servers:
  - url: https://v2-nova-api.prod.czmx.in/api
security:
  - BearerAuth: []
paths:
  /org/{org_id}/agents:
    get:
      description: Get a paginated list of agents for the organization
      operationId: listAgents
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Page size
          in: query
          name: size
          schema:
            type: integer
            default: 20
        - description: Filter by agent type (voice or chat)
          in: query
          name: type
          schema:
            type: string
        - description: Search by agent name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.PaginatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: List agents
      tags:
        - Agents
    post:
      description: Create a new AI agent in the organization
      operationId: createAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.CreateAgentRequest'
        description: Agent details
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '409':
          description: Duplicate agent name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Create agent
      tags:
        - Agents
  /org/{org_id}/agents/{agent_id}:
    delete:
      description: Delete an agent by ID
      operationId: deleteAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Delete agent
      tags:
        - Agents
    get:
      description: Get agent details by ID
      operationId: getAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Get agent
      tags:
        - Agents
    patch:
      description: Update agent details (partial update)
      operationId: updateAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.UpdateAgentRequest'
        description: Agent update details
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Update agent
      tags:
        - Agents
  /org/{org_id}/calls:
    get:
      description: Returns a paginated list of calls for the organization with optional filters
      operationId: listCalls
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Page size
          in: query
          name: size
          schema:
            type: integer
            maximum: 100
            default: 50
        - description: Filter by status (SCHEDULED, RINGING, IN_PROGRESS, completed, no-answer, failed, busy)
          in: query
          name: status
          schema:
            type: string
        - description: Filter by direction (INBOUND, OUTBOUND)
          in: query
          name: direction
          schema:
            type: string
        - description: Filter by agent ID
          in: query
          name: agent_id
          schema:
            type: string
        - description: Filter by prospect ID
          in: query
          name: prospect_id
          schema:
            type: string
        - description: Filter by workflow ID
          in: query
          name: workflow_id
          schema:
            type: string
        - description: Filter by prospect external ID
          in: query
          name: prospect_external_id
          schema:
            type: string
        - description: Filter by prospect name (first or last)
          in: query
          name: prospect_name
          schema:
            type: string
        - description: Filter by start date (ISO 8601)
          in: query
          name: start_date
          schema:
            type: string
        - description: Filter by end date (ISO 8601)
          in: query
          name: end_date
          schema:
            type: string
        - description: Filter by minimum duration in seconds
          in: query
          name: min_duration
          schema:
            type: integer
        - description: Search by phone number
          in: query
          name: phone
          schema:
            type: string
        - description: Filter by evaluation outcome key (e.g. is_interested)
          in: query
          name: evaluation_key
          schema:
            type: string
        - description: Filter by evaluation value (e.g. true, false, or extracted text)
          in: query
          name: evaluation_value
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/calls.PaginatedCallsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      security:
        - BearerAuth: []
      summary: List calls
      tags:
        - Calls
  /org/{org_id}/calls/{call_id}:
    get:
      description: Returns full details for a specific call including prospect and agent info
      operationId: getCallDetails
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Call ID
          in: path
          name: call_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/calls.CallDetailResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      security:
        - BearerAuth: []
      summary: Get call details
      tags:
        - Calls
  /org/{org_id}/voices:
    get:
      description: Get a paginated list of available voices from the specified provider
      operationId: listVoices
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Voice provider
          in: query
          name: provider
          required: true
          schema:
            type: string
            enum:
              - elevenlabs
              - cartesia
              - openai
              - cambai
              - sarvam
              - inworld
              - minimax
        - description: 'Page number (default: 1) - used for offset pagination'
          in: query
          name: page
          schema:
            type: integer
        - description: 'Page size (default: 50, max: 100)'
          in: query
          name: size
          schema:
            type: integer
        - description: Cursor for next page - used for native pagination (cartesia, elevenlabs)
          in: query
          name: next_page
          schema:
            type: string
        - description: Filter by model (e.g., bulbul:v2, bulbul:v3) - only for sarvam provider
          in: query
          name: model
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/voices.ListVoicesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: List voices
      tags:
        - Voices
  /org/{org_id}/workflow-runs:
    post:
      description: Create a new workflow run with prospect creation in a single operation (API endpoint)
      operationId: createWorkflowRunWithProspect
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workflow-batches.CreateWorkflowRunWithProspectRequest'
        description: Workflow run details
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflow-batches.CreateWorkflowRunWithProspectResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Create workflow run with prospect
      tags:
        - Workflow Runs
  /org/{org_id}/workflows:
    get:
      description: Get a paginated list of workflows with filtering
      operationId: listWorkflows
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Page size
          in: query
          name: size
          schema:
            type: integer
            default: 20
        - description: Filter by active status
          in: query
          name: is_active
          schema:
            type: boolean
        - description: Filter by trigger type
          in: query
          name: trigger_type
          schema:
            type: string
        - description: Search in workflow name and description
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflows.PaginatedWorkflowsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: List workflows
      tags:
        - Workflows
  /org/{org_id}/workflows/{workflow_id}:
    get:
      description: Get a single workflow by ID with its latest definition
      operationId: getWorkflow
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Workflow ID
          in: path
          name: workflow_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflows.WorkflowResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Get workflow
      tags:
        - Workflows
components:
  requestBodies:
    tags.BulkTagProspectsRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/tags.BulkTagProspectsRequest'
      description: Prospect IDs
      required: true
    chat.SendMessageRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/chat.SendMessageRequest'
      description: Chat message
      required: true
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    admin.LivenessResponse:
      properties:
        status:
          example: ok
          type: string
      type: object
    admin.ReadinessResponse:
      properties:
        database:
          example: ok
          type: string
        status:
          example: ok
          type: string
      type: object
    agents.AddAgentSipTrunkRequest:
      properties:
        sip_trunk_id:
          type: string
      required:
        - sip_trunk_id
      type: object
    agents.AddAgentToolRequest:
      properties:
        config_override:
          additionalProperties: true
          type: object
        is_enabled:
          type: boolean
        tool_id:
          type: string
      required:
        - tool_id
      type: object
    agents.AgentListItemResponse:
      properties:
        created_at:
          type: string
        id:
          type: string
        name:
          type: string
        type:
          type: string
        updated_at:
          type: string
      type: object
    agents.AgentResponse:
      properties:
        allowed_sip_trunks:
          items:
            type: string
          type: array
        background_sound:
          items:
            type: integer
          type: array
        created_at:
          type: string
        default_functions:
          items:
            type: string
          type: array
        extra_config:
          items:
            type: integer
          type: array
        goodbye_config:
          items:
            type: integer
          type: array
        greeting_config:
          items:
            type: integer
          type: array
        id:
          type: string
        llm_config:
          items:
            type: integer
          type: array
        name:
          type: string
        organization_id:
          type: string
        plugins:
          items:
            type: integer
          type: array
        precall_webhook:
          items:
            type: integer
          type: array
        prompt_template:
          type: string
        public_quota:
          type: integer
        room_duration_config:
          items:
            type: integer
          type: array
        tools:
          items:
            $ref: '#/components/schemas/agents.AgentToolResponse'
          type: array
        transcriber_config:
          items:
            type: integer
          type: array
        type:
          type: string
        updated_at:
          type: string
        vad_config:
          items:
            type: integer
          type: array
        voice_config:
          items:
            type: integer
          type: array
      type: object
    agents.AgentScenariosResponse:
      properties:
        agent_id:
          type: string
        count:
          type: integer
        scenarios:
          items:
            $ref: '#/components/schemas/agents.ScenarioSummaryResponse'
          type: array
      type: object
    agents.AgentSipTrunkResponse:
      properties:
        id:
          type: string
        is_active:
          type: boolean
        name:
          type: string
        provider:
          type: string
        type:
          type: string
      type: object
    agents.AgentToolResponse:
      properties:
        config_override:
          additionalProperties: true
          type: object
        description:
          type: string
        is_enabled:
          type: boolean
        method:
          type: string
        name:
          type: string
        parameters:
          items:
            $ref: '#/components/schemas/agents.ToolParameter'
          type: array
        tool_id:
          type: string
        url:
          type: string
      type: object
    agents.AttachScenariosResponse:
      properties:
        attached:
          items:
            type: string
          type: array
        skipped:
          items:
            type: string
          type: array
      type: object
    agents.AttachScenariosToAgentRequest:
      properties:
        scenario_ids:
          items:
            type: string
          minItems: 1
          type: array
      required:
        - scenario_ids
      type: object
    agents.BackgroundSoundConfig:
      properties:
        enabled:
          type: boolean
        file:
          type: string
        initial_volume:
          maximum: 1
          minimum: 0
          type: number
        thinking_sound:
          items:
            $ref: '#/components/schemas/agents.ThinkingSound'
          type: array
        volume:
          maximum: 1
          minimum: 0
          type: number
      required:
        - file
      type: object
    agents.CreateAgentRequest:
      properties:
        copy_from_agent_id:
          type: string
        name:
          type: string
        prompt_template:
          type: string
        type:
          enum:
            - voice
            - chat
            - video
          type: string
      required:
        - name
        - type
      type: object
    agents.ExtraConfig:
      properties:
        allow_interruptions:
          type: boolean
        interruption_sensitivity:
          maximum: 1
          minimum: 0
          type: number
        min_words:
          minimum: 0
          type: integer
        turn_detector_enabled:
          type: boolean
        turn_detector_is_multilingual:
          type: boolean
        turn_detector_model_type:
          type: string
        use_gender_plugin:
          enum:
            - none
            - pitch
            - enhanced
            - enhanced-multi
          type: string
      type: object
    agents.GoodbyeConfig:
      properties:
        enabled:
          type: boolean
        message:
          maxLength: 500
          type: string
      type: object
    agents.GreetingConfig:
      properties:
        agent_speaks_first:
          type: boolean
        greeting:
          type: string
        pause_before_first_message:
          minimum: 0
          type: integer
        voice_mail_message:
          type: string
        welcome_message_is_generated:
          type: boolean
      type: object
    agents.LLMConfig:
      properties:
        fallbacks:
          description: Ordered list of fallback providers tried in sequence when the primary LLM fails
          items:
            $ref: '#/components/schemas/agents.LLMConfig'
          type: array
        frequency_penalty:
          maximum: 2
          minimum: -2
          type: number
        max_tokens:
          minimum: 1
          type: integer
        model:
          type: string
        parallel_tool_calls:
          type: boolean
        presence_penalty:
          description: OpenAI Only
          maximum: 2
          minimum: -2
          type: number
        provider:
          description: Core (All Providers)
          enum:
            - openai
            - anthropic
            - google
            - groq
            - cerebras
          type: string
        system_prompt:
          type: string
        temperature:
          description: Sampling Parameters (All Providers)
          maximum: 2
          minimum: 0
          type: number
        top_k:
          description: Anthropic Only
          minimum: 1
          type: integer
        top_p:
          maximum: 1
          minimum: 0
          type: number
      required:
        - model
        - provider
      type: object
    agents.PaginatedResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/agents.AgentListItemResponse'
          type: array
        meta:
          $ref: '#/components/schemas/agents.PaginationMeta'
      type: object
    agents.PaginationMeta:
      properties:
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      type: object
    agents.PrecallWebhookConfig:
      properties:
        body_template:
          additionalProperties: true
          type: object
        headers:
          additionalProperties:
            type: string
          type: object
        method:
          enum:
            - GET
            - POST
            - PUT
            - PATCH
          type: string
        timeout_seconds:
          maximum: 60
          minimum: 1
          type: integer
        url:
          type: string
      required:
        - method
        - url
      type: object
    agents.ReplenishQuotaRequest:
      properties:
        quota:
          minimum: 0
          type: integer
      required:
        - quota
      type: object
    agents.RoomDurationConfig:
      properties:
        close_room_message:
          type: string
        duration_warning_message:
          type: string
