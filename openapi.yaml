webhooks:
  callCompleted:
    post:
      summary: Call Completed
      description: |
        Fired when a call finishes successfully or is analyzed.
        This webhook is sent when the call ends and post-call analysis is complete.
      operationId: callCompleted
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/webhook.CallCompletedPayload"
      responses:
        "200":
          description: Webhook received successfully
  callFailed:
    post:
      summary: Call Failed
      description: |
        Fired when a call fails due to technical or validation issues.
        This includes SIP errors, validation failures, and other error conditions.
      operationId: callFailed
      tags:
        - Webhooks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/webhook.CallFailedPayload"
      responses:
        "200":
          description: Webhook received successfully
