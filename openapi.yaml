      tags:
        - Agent Unit Tests
  "/org/{org_id}/agents/{agent_id}/unit-tests/delete":
    post:
      description: Delete multiple unit tests by IDs
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
