openapi: 3.0.0
info:
  contact: {}
  title: Cozmo - API
  version: devel
servers:
  - url: https://v2-nova-api.prod.czmx.in/api
security:
  - BearerAuth: []
paths:
  /org/{org_id}/agent-sessions:
    post:
      description: Create a new agent session for the organization. Supply either prospect_id for an existing prospect or new_prospect to create one inline.
      operationId: createAgentSession
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent-sessions.CreateSessionRequest'
        description: Session details
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-sessions.SessionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Create agent session
      tags:
        - Agent Sessions
      x-hidden: true
  /org/{org_id}/agent-sessions/{session_id}:
    get:
      description: Get the details of an agent session by ID
      operationId: getAgentSession
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Session ID
          in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-sessions.SessionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Get agent session
      tags:
        - Agent Sessions
  /org/{org_id}/agent-sessions/{session_id}/start:
    post:
      description: >
        Creates the session record, appends the initial instruction as a user message event,
        and triggers the agent workflow — all in a single call. The session_id must be a
        client-generated UUID v4 and is used to idempotently reference the session afterward.
      operationId: startAgentSession
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Client-generated UUID v4 for the session
          in: path
          name: session_id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agent-sessions.StartSessionRequest'
        description: Session start parameters
        required: true
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-sessions.StartSessionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Start agent session
      tags:
        - Agent Sessions
  /org/{org_id}/agents:
    get:
      description: Get a paginated list of agents for the organization
      operationId: listAgents
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Page size
          in: query
          name: size
          schema:
            type: integer
            default: 20
        - description: Filter by agent type (voice or chat)
          in: query
          name: type
          schema:
            type: string
        - description: Search by agent name
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.PaginatedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: List agents
      tags:
        - Agents
    post:
      description: Create a new AI agent in the organization
      operationId: createAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.CreateAgentRequest'
        description: Agent details
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '409':
          description: Duplicate agent name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Create agent
      tags:
        - Agents
  /org/{org_id}/agents/{agent_id}:
    delete:
      description: Delete an agent by ID
      operationId: deleteAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Delete agent
      tags:
        - Agents
    get:
      description: Get agent details by ID
      operationId: getAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Get agent
      tags:
        - Agents
    patch:
      description: Update agent details (partial update)
      operationId: updateAgent
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Agent ID
          in: path
          name: agent_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/agents.UpdateAgentRequest'
        description: Agent update details
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agents.AgentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Update agent
      tags:
        - Agents
  /org/{org_id}/calls:
    get:
      description: Returns a paginated list of calls for the organization with optional filters
      operationId: listCalls
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Page size
          in: query
          name: size
          schema:
            type: integer
            maximum: 100
            default: 50
        - description: Filter by status (SCHEDULED, RINGING, IN_PROGRESS, completed, no-answer, failed, busy)
          in: query
          name: status
          schema:
            type: string
        - description: Filter by direction (INBOUND, OUTBOUND)
          in: query
          name: direction
          schema:
            type: string
        - description: Filter by agent ID
          in: query
          name: agent_id
          schema:
            type: string
        - description: Filter by prospect ID
          in: query
          name: prospect_id
          schema:
            type: string
        - description: Filter by workflow ID
          in: query
          name: workflow_id
          schema:
            type: string
        - description: Filter by prospect external ID
          in: query
          name: prospect_external_id
          schema:
            type: string
        - description: Filter by prospect name (first or last)
          in: query
          name: prospect_name
          schema:
            type: string
        - description: Filter by start date (ISO 8601)
          in: query
          name: start_date
          schema:
            type: string
        - description: Filter by end date (ISO 8601)
          in: query
          name: end_date
          schema:
            type: string
        - description: Filter by minimum duration in seconds
          in: query
          name: min_duration
          schema:
            type: integer
        - description: Search by phone number
          in: query
          name: phone
          schema:
            type: string
        - description: Filter by evaluation outcome key (e.g. is_interested)
          in: query
          name: evaluation_key
          schema:
            type: string
        - description: Filter by evaluation value (e.g. true, false, or extracted text)
          in: query
          name: evaluation_value
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/calls.PaginatedCallsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      security:
        - BearerAuth: []
      summary: List calls
      tags:
        - Calls
    post:
      description: Create a new outbound call directly (on-demand call)
      operationId: createDashboardCall
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/calls.CreateDashboardCallRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/calls.CreateDashboardCallResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Create outbound call
      tags:
        - Calls
  /org/{org_id}/calls/{call_id}:
    get:
      description: Returns full details for a specific call including prospect and agent info
      operationId: getCallDetails
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Call ID
          in: path
          name: call_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/calls.CallDetailResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      security:
        - BearerAuth: []
      summary: Get call details
      tags:
        - Calls
  /org/{org_id}/calls/export:
    get:
      description: Export all calls matching the supplied filters as a CSV file. Export jobs are capped at 10,000 matching calls.
      operationId: exportCalls
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Filter by status
          in: query
          name: status
          schema:
            type: string
        - description: Filter by direction
          in: query
          name: direction
          schema:
            type: string
        - description: Filter by agent ID
          in: query
          name: agent_id
          schema:
            type: string
        - description: Filter by prospect ID
          in: query
          name: prospect_id
          schema:
            type: string
        - description: Filter by workflow ID
          in: query
          name: workflow_id
          schema:
            type: string
        - description: Filter by prospect external ID
          in: query
          name: prospect_external_id
          schema:
            type: string
        - description: Filter by prospect name (first or last)
          in: query
          name: prospect_name
          schema:
            type: string
        - description: Filter by start date (ISO 8601)
          in: query
          name: start_date
          schema:
            type: string
        - description: Filter by end date (ISO 8601)
          in: query
          name: end_date
          schema:
            type: string
        - description: Filter by minimum duration in seconds
          in: query
          name: min_duration
          schema:
            type: integer
        - description: Search by phone number
          in: query
          name: phone
          schema:
            type: string
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Export calls to CSV
      tags:
        - Calls
  /org/{org_id}/calls/export/count:
    get:
      description: Return the total number of calls that match the export filters before you download a CSV.
      operationId: exportCallsCount
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Filter by status
          in: query
          name: status
          schema:
            type: string
        - description: Filter by direction
          in: query
          name: direction
          schema:
            type: string
        - description: Filter by agent ID
          in: query
          name: agent_id
          schema:
            type: string
        - description: Filter by prospect ID
          in: query
          name: prospect_id
          schema:
            type: string
        - description: Filter by workflow ID
          in: query
          name: workflow_id
          schema:
            type: string
        - description: Filter by prospect external ID
          in: query
          name: prospect_external_id
          schema:
            type: string
        - description: Filter by prospect name (first or last)
          in: query
          name: prospect_name
          schema:
            type: string
        - description: Filter by start date (ISO 8601)
          in: query
          name: start_date
          schema:
            type: string
        - description: Filter by end date (ISO 8601)
          in: query
          name: end_date
          schema:
            type: string
        - description: Filter by minimum duration in seconds
          in: query
          name: min_duration
          schema:
            type: integer
        - description: Search by phone number
          in: query
          name: phone
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/calls.ExportCountResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Get call export count
      tags:
        - Calls
  /org/{org_id}/voices:
    get:
      description: Get a paginated list of available voices from the specified provider
      operationId: listVoices
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Voice provider
          in: query
          name: provider
          required: true
          schema:
            type: string
            enum:
              - elevenlabs
              - cartesia
              - openai
              - cambai
              - sarvam
              - inworld
              - minimax
        - description: 'Page number (default: 1) - used for offset pagination'
          in: query
          name: page
          schema:
            type: integer
        - description: 'Page size (default: 50, max: 100)'
          in: query
          name: size
          schema:
            type: integer
        - description: Cursor for next page - used for native pagination (cartesia, elevenlabs)
          in: query
          name: next_page
          schema:
            type: string
        - description: Filter by model (e.g., bulbul:v2, bulbul:v3) - only for sarvam provider
          in: query
          name: model
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/voices.ListVoicesResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: List voices
      tags:
        - Voices
  /org/{org_id}/workflow-runs:
    post:
      description: Create a new workflow run with prospect creation in a single operation (API endpoint)
      operationId: createWorkflowRunWithProspect
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workflow-batches.CreateWorkflowRunWithProspectRequest'
        description: Workflow run details
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflow-batches.CreateWorkflowRunWithProspectResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
      summary: Create workflow run with prospect
      tags:
        - Workflow Runs
  /org/{org_id}/workflows:
    get:
      description: Get a paginated list of workflows with filtering
      operationId: listWorkflows
      parameters:
        - description: Organization ID
          in: path
          name: org_id
          required: true
          schema:
            type: string
        - description: Page number
          in: query
          name: page
          schema:
            type: integer
            default: 1
        - description: Page size
          in: query
          name: size
          schema:
            type: integer
            default: 20
        - description: Filter by active status
          in: query
          name: is_active
          schema:
            type: boolean
        - description: Filter by trigger type
          in: query
          name: trigger_type
          schema:
            type: string
        - description: Search in workflow name and description
          in: query
          name: search
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflows.PaginatedWorkflowsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/helper.ResponseError'
        '429':
          description: Rate limit exceeded
