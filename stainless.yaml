version: "1.0"

openapi: openapi.yaml

targets:
  node:
    package_name: cozmoai
  python:
    package_name: cozmoai

resources:
  # --- Agents ---
  agents:
    methods:
      list: listAgents
      create: createAgent
      retrieve: getAgent
      update: updateAgent
      delete: deleteAgent

  # --- Calls ---
  calls:
    methods:
      list: listCalls
      retrieve: getCallDetails

  # --- Voices ---
  voices:
    methods:
      list: listVoices

  # --- Workflows ---
  workflows:
    methods:
      list: listWorkflows
      retrieve: getWorkflow
